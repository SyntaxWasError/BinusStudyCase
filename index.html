<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Profil anggota tim Study Case Git dan GitHub Workshop"
    />
    <title>Study Case - Git &amp; GitHub Workshop</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="navbar">
      <h1 class="logo">Profile Card</h1>

      <div class="navbar-actions">
        <nav class="member-nav" aria-label="Navigasi anggota">
          <button
            class="member-link active"
            type="button"
            data-member="0"
            aria-pressed="true"
          >
            Adiarta
          </button>
          <button
            class="member-link"
            type="button"
            data-member="1"
            aria-pressed="false"
          >
            Frangky
          </button>
          <button
            class="member-link"
            type="button"
            data-member="2"
            aria-pressed="false"
          >
            Keindiva
          </button>
        </nav>

        <button id="theme-toggle" class="btn-toggle" type="button">
          🌙 Dark Mode
        </button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="user-name">
        <img
          src="assets/anggota_1.jpg"
          alt="Foto profil Adiarta"
          class="avatar"
        />
        <h2 id="user-name">Adiarta</h2>
        <p id="user-role">Vibe Coder &amp; Web Designer</p>
        <button id="counter-btn" class="btn-primary" type="button">
          👍 Like (<span id="counter">0</span>)
        </button>
      </section>

      <section class="about" aria-labelledby="about-title">
        <h3 id="about-title">Tentang Saya</h3>
        <p>
          Haloo aku Adiarta, seorang atlet renang yang juga suka belajar programming!
        </p>
      </section>

      <section class="skills" aria-labelledby="skills-title">
        <h3 id="skills-title">Skill</h3>
        <ul id="skill-list">
          <li>C</li>
          <li>HTML</li>
          <li>CSS</li>
          <li>Web Design</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Workshop Git &amp; GitHub</p>
    </footer>
  </body>
</html>
